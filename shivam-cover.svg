      <rect x="1" y="1" width="523" height="52" rx="16" fill="#161d32"/>
      <path d="M 1 52 H 524" stroke="#5875a6" stroke-opacity=".5"/>
      <circle cx="27" cy="26" r="7" fill="#fb6b83"/>
      <circle cx="51" cy="26" r="7" fill="#f3be61"/>
      <circle cx="75" cy="26" r="7" fill="#44d6a0"/>
      <text x="263" y="32" text-anchor="middle" fill="#94a4bd" font-family="Consolas, monospace" font-size="16">shivam@terminal:~</text>
      <text x="25" y="95" fill="#41e8cc" font-family="Consolas, monospace" font-size="18">➜  ~ $ whoami</text>
      <text x="25" y="125" fill="#dee8ff" font-family="Consolas, monospace" font-size="17">pentester / bug-bounty hunter</text>
      <text x="25" y="163" fill="#41e8cc" font-family="Consolas, monospace" font-size="18">➜  ~ $ cat interests.txt</text>
      <text x="25" y="193" fill="#cbd8ef" font-family="Consolas, monospace" font-size="17">web security · automation</text>
      <text x="25" y="221" fill="#cbd8ef" font-family="Consolas, monospace" font-size="17">research · local-first AI</text>
      <text x="25" y="259" fill="#b68bfa" font-family="Consolas, monospace" font-size="18">➜  ~ $ play after-hours.wav</text>
      <g transform="translate(30 276)" fill="url(#line)">
