        <rect x="98" y="8" width="7" height="12" rx="3"/>
        <rect x="112" y="0" width="7" height="28" rx="3"/>
        <rect x="126" y="5" width="7" height="18" rx="3"/>
        <rect x="140" y="9" width="7" height="10" rx="3"/>
        <rect x="154" y="3" width="7" height="22" rx="3"/>
        <rect x="168" y="7" width="7" height="14" rx="3"/>
        <rect x="182" y="0" width="7" height="28" rx="3"/>
        <rect x="196" y="6" width="7" height="16" rx="3"/>
      </g>
    </g>
  </g>
